version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: unitymcp-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (opsiyonel)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO

volumes:
  qdrant_data:
    driver: local
